<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Castle Fight</title>
<style>
  :root { --bg:#12151c; --panel:#1b2030; --panel2:#242b40; --line:#33405e; --txt:#e8ecf5; --dim:#8b97b5; --me:#3b82f6; --foe:#ef4444; --gold:#facc15; --crys:#38bdf8; --ok:#4ade80; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--txt); font:14px/1.35 system-ui,Segoe UI,Roboto,sans-serif; }
  .hidden { display:none !important; }
  button { font:inherit; color:inherit; cursor:pointer; }
  input { font:inherit; }
  .screen { max-width:1200px; margin:0 auto; padding:12px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:20px; max-width:480px; margin:8vh auto 0; }
  .card h1 { margin:0 0 4px; font-size:28px; }
  .card p { color:var(--dim); margin:0 0 16px; }
  .row { display:flex; gap:8px; margin:10px 0; align-items:center; flex-wrap:wrap; }
  .row > input { flex:1; min-width:0; }
  input[type=text] { background:#0f1320; border:1px solid var(--line); border-radius:8px; padding:10px; color:var(--txt); }
  .btn { background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:10px 14px; }
  .btn:hover:not(:disabled) { border-color:#6b82b8; }
  .btn.primary { background:#2c5ee8; border-color:#4a78ff; font-weight:600; }
  .btn.sel { outline:2px solid var(--ok); }
  .btn:disabled { opacity:.45; cursor:default; }
  .seg { display:flex; gap:8px; } .seg .btn { flex:1; }
  .plist { margin:12px 0; } .pl { display:flex; justify-content:space-between; padding:8px 10px; background:var(--panel2); border-radius:8px; margin-bottom:6px; }
  .code { font-size:34px; letter-spacing:6px; font-weight:700; color:var(--gold); }
  .dim { color:var(--dim); } .small { font-size:12px; }

  #topbar { display:grid; grid-template-columns:1fr auto 1fr; gap:12px; align-items:center; margin-bottom:6px; }
  .hp { position:relative; height:26px; background:#0f1320; border:1px solid var(--line); border-radius:6px; overflow:hidden; }
  .hp i { position:absolute; inset:0 auto 0 0; background:var(--me); transition:width .2s; }
  .hp.foe i { background:var(--foe); right:0; left:auto; inset:0 0 0 auto; }
  .hp span { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-weight:600; text-shadow:0 1px 2px #000; }
  #timer { font-size:22px; font-weight:700; min-width:80px; text-align:center; }
  #res { display:flex; gap:16px; align-items:center; margin-bottom:6px; flex-wrap:wrap; }
  #res .chip { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:5px 10px; }
  #stage { position:relative; }
  canvas { width:100%; height:auto; display:block; background:#000; border-radius:10px; border:1px solid var(--line); touch-action:none; }
  #banner { position:absolute; top:10px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,.7); padding:6px 14px; border-radius:20px; pointer-events:none; }
  #toast { position:absolute; bottom:12px; left:50%; transform:translateX(-50%); background:#b91c1c; padding:6px 14px; border-radius:8px; opacity:0; transition:opacity .25s; pointer-events:none; }
  #toast.on { opacity:1; }
  #bottom { display:grid; grid-template-columns:1.3fr 1fr 1fr; gap:8px; margin-top:8px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:8px; min-height:120px; }
  .panel h3 { margin:0 0 6px; font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--dim); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:6px; }
  .gb { display:flex; flex-direction:column; align-items:flex-start; gap:1px; text-align:left; background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:6px 8px; }
  .gb:hover:not(.off) { border-color:#6b82b8; }
  .gb.off { opacity:.45; } .gb.act { outline:2px solid var(--ok); }
  .gb b { font-size:13px; } .gb small { color:var(--dim); }
  .bar { height:6px; background:#0f1320; border-radius:3px; overflow:hidden; margin:3px 0; } .bar i { display:block; height:100%; background:var(--ok); }
  #endbox { position:absolute; inset:0; background:rgba(8,10,16,.82); display:flex; align-items:center; justify-content:center; border-radius:10px; }
  #endbox .card { margin:0; text-align:center; max-width:520px; }
  table { width:100%; border-collapse:collapse; margin:10px 0; } td,th { padding:4px 8px; border-bottom:1px solid var(--line); text-align:center; } th { color:var(--dim); font-weight:500; }
  @media (max-width:800px){ #bottom { grid-template-columns:1fr; } #topbar { grid-template-columns:1fr; } }
</style>
</head>
<body>

<div id="menu" class="screen">
  <div class="card">
    <h1>🏰 Castle Fight</h1>
    <p>Прототип 1 на 1: стройте здания, они сами выпускают бойцов. Разрушьте замок врага.</p>
    <div class="row"><input type="text" id="name" maxlength="16" placeholder="Ваше имя"></div>
    <div class="seg" id="menuFaction">
      <button class="btn sel" data-f="human">⚔️ Люди</button>
      <button class="btn" data-f="orc">🪓 Орки</button>
    </div>
    <div class="row"><button class="btn primary" id="bCreate" style="flex:1">Создать комнату</button></div>
    <div class="row"><input type="text" id="codeIn" maxlength="4" placeholder="Код комнаты" style="text-transform:uppercase"><button class="btn" id="bJoin">Войти</button></div>
    <div class="row"><button class="btn" id="bBot" style="flex:1">Тренировка с ботом</button></div>
    <div class="dim small" id="menuMsg"></div>
  </div>
</div>

<div id="lobby" class="screen hidden">
  <div class="card">
    <div class="dim">Код комнаты — отправьте его другу</div>
    <div class="code" id="lobCode">----</div>
    <div class="row"><button class="btn" id="bCopy">Скопировать ссылку</button></div>
    <div class="plist" id="lobPlayers"></div>
    <div class="seg" id="lobFaction">
      <button class="btn" data-f="human">⚔️ Люди</button>
      <button class="btn" data-f="orc">🪓 Орки</button>
    </div>
    <div class="row"><button class="btn primary" id="bReady" style="flex:1">Готов</button><button class="btn" id="bLeave">Выйти</button></div>
  </div>
</div>

<div id="game" class="screen hidden">
  <div id="topbar">
    <div><div class="dim small" id="myName"></div><div class="hp"><i id="myHpBar"></i><span id="myHpTxt"></span></div></div>
    <div id="timer">12:00</div>
    <div><div class="dim small" style="text-align:right" id="foeName"></div><div class="hp foe"><i id="foeHpBar"></i><span id="foeHpTxt"></span></div></div>
  </div>
  <div id="res">
    <span class="chip">🪙 <b id="gold">0</b> <span class="dim small" id="inc"></span></span>
    <span class="chip">💎 <b id="crys">0</b> <span class="dim small" id="crysT"></span></span>
    <span class="chip">👥 <b id="army">0</b>/40</span>
    <span class="chip">☠️ <b id="kills">0</b></span>
  </div>
  <div id="stage">
    <canvas id="cv" width="1280" height="480"></canvas>
    <div id="banner" class="hidden"></div>
    <div id="toast"></div>
    <div id="endbox" class="hidden"></div>
  </div>
  <div id="bottom">
    <div class="panel"><h3>Здания</h3><div class="grid" id="buildPanel"></div></div>
    <div class="panel" id="selPanel"></div>
    <div class="panel"><h3>Магазин и ультимейт</h3><div class="grid" id="shopPanel"></div></div>
  </div>
</div>

<script>
'use strict';
const $ = id => document.getElementById(id);
let DATA, S, L, W;
let ws = null, wsOpen = false;
let mySide = 0, roomCode = null, myToken = null, factions = ['human', 'orc'], names = ['', ''];
let menuFaction = 'human';
let snap = null, snapAt = 0, ended = null;
let selected = null;        // id выбранного здания
let mode = null;            // {k:'place'|'heal'|'drum'|'salve'|'charge', ...}
let mouse = { x: 0, y: 0, in: false };
const disp = new Map();     // id -> сглаженная позиция юнита
const fx = [];

// ---------- сеть ----------
const store = {
  get() { try { return JSON.parse(sessionStorage.getItem('cf') || 'null'); } catch { return null; } },
  set(v) { try { v ? sessionStorage.setItem('cf', JSON.stringify(v)) : sessionStorage.removeItem('cf'); } catch {} }
};
function send(o) { if (ws && wsOpen) ws.send(JSON.stringify(o)); }

function connect() {
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);
  ws.onopen = () => {
    wsOpen = true; $('menuMsg').textContent = '';
    const s = store.get();
    if (s) send({ t: 'join', code: s.code, token: s.token, name: $('name').value });
  };
  ws.onclose = () => { wsOpen = false; $('menuMsg').textContent = 'Нет соединения, переподключаюсь…'; setTimeout(connect, 1500); };
  ws.onmessage = e => onMsg(JSON.parse(e.data));
}
setInterval(() => send({ t: 'ping' }), 20000);

function onMsg(m) {
  switch (m.t) {
    case 'joined':
      mySide = m.side; roomCode = m.code; myToken = m.token;
      store.set({ code: m.code, token: m.token });
      history.replaceState(null, '', '?room=' + m.code);
      break;
    case 'lobby': renderLobby(m); break;
    case 'start':
      factions = m.factions; names = m.names; startMatch(); break;
    case 's': snap = m; snapAt = performance.now(); onSnap(); break;
    case 'end': ended = m; showEnd(); break;
    case 'rematchWait': if (m.side === mySide) { const b = $('bRematch'); if (b) { b.disabled = true; b.textContent = 'Ждём соперника…'; } } break;
    case 'opponentLeft': { const b = $('bRematch'); if (b) { b.disabled = true; b.textContent = 'Соперник вышел'; } } break;
    case 'err':
      toast(m.msg);
      if (m.fatal) { store.set(null); show('menu'); $('menuMsg').textContent = m.msg; }
      break;
  }
}

// ---------- экраны ----------
function show(id) { for (const s of ['menu', 'lobby', 'game']) $(s).classList.toggle('hidden', s !== id); }
let toastT;
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 1800); }

function setFactionButtons(box, f) { box.querySelectorAll('button').forEach(b => b.classList.toggle('sel', b.dataset.f === f)); }

$('menuFaction').onclick = e => { const b = e.target.closest('button'); if (!b) return; menuFaction = b.dataset.f; setFactionButtons($('menuFaction'), menuFaction); };
const myName = () => { const n = $('name').value.trim(); try { localStorage.setItem('cfName', n); } catch {} return n || 'Игрок'; };
$('bCreate').onclick = () => send({ t: 'create', name: myName(), faction: menuFaction });
$('bBot').onclick = () => send({ t: 'bot', name: myName(), faction: menuFaction });
$('bJoin').onclick = () => { const c = $('codeIn').value.trim().toUpperCase(); if (c.length === 4) send({ t: 'join', code: c, name: myName(), faction: menuFaction }); };
$('codeIn').onkeydown = e => { if (e.key === 'Enter') $('bJoin').click(); };
$('lobFaction').onclick = e => { const b = e.target.closest('button'); if (b) send({ t: 'faction', faction: b.dataset.f }); };
let amReady = false;
$('bReady').onclick = () => send({ t: 'ready', ready: !amReady });
$('bLeave').onclick = leaveRoom;
$('bCopy').onclick = () => { const u = location.origin + '/?room=' + roomCode; navigator.clipboard && navigator.clipboard.writeText(u); toast('Ссылка скопирована'); };
function leaveRoom() { send({ t: 'leave' }); store.set(null); history.replaceState(null, '', '/'); snap = null; ended = null; show('menu'); }

function renderLobby(m) {
  if (!$('game').classList.contains('hidden') && m.state === 'playing') return;
  show('lobby');
  $('lobCode').textContent = m.code;
  $('lobPlayers').innerHTML = m.players.map((p, i) => p
    ? `<div class="pl"><span>${i === mySide ? '👤 ' : '🎮 '}${p.name} — ${DATA.factions[p.faction]}</span><span>${p.ready ? '✅ готов' : '⏳'}${p.online ? '' : ' (офлайн)'}</span></div>`
    : `<div class="pl dim"><span>Ждём второго игрока…</span></div>`).join('');
  const me = m.players[mySide];
  amReady = !!(me && me.ready);
  setFactionButtons($('lobFaction'), me && me.faction);
  $('bReady').textContent = amReady ? 'Не готов' : 'Готов';
  $('bReady').disabled = !m.players[1];
}

// ---------- матч ----------
function startMatch() {
  ended = null; snap = null; selected = null; mode = null; disp.clear(); fx.length = 0; bdisp[0] = bdisp[1] = null; follow = true; camX = 0; camY = 0;
  $('endbox').classList.add('hidden');
  show('game');
  $('myName').textContent = names[mySide] + ' · ' + DATA.factions[factions[mySide]];
  $('foeName').textContent = names[1 - mySide] + ' · ' + DATA.factions[factions[1 - mySide]];
  buildStaticPanels();
}

const cost = c => [c.g ? c.g + '🪙' : '', c.c ? c.c + '💎' : ''].filter(Boolean).join(' ');

function unitInfo(k) {
  const u = DATA.units[k];
  return `${u.name}: ${u.hp} HP, броня ${u.armor} (${u.armorType}), атака ${u.attackType} ${u.damage[0]}–${u.damage[1]}, DPS ${u.dps}, дальность ${u.range}` + (u.skill ? `. Навык ${u.skill.name}: ${u.skill.desc}` : '');
}

function buildStaticPanels() {
  const f = factions[mySide];
  $('buildPanel').innerHTML = Object.entries(DATA.buildings).filter(([k, b]) => b.faction === f && !b.upgradeOnly).map(([k, b]) =>
    `<button class="gb" data-a="build" data-k="${k}" title="${b.desc}${b.unit ? '\n' + unitInfo(b.unit) : ''}"><b>${b.icon} ${b.name}</b><small>${cost(b.cost)}</small></button>`).join('');
  const ult = DATA.ults[f];
  $('shopPanel').innerHTML = Object.entries(DATA.items).map(([k, i]) =>
    `<button class="gb" data-a="item" data-k="${k}" title="${i.desc}"><b>${i.icon} ${i.name}</b><small>${cost(i.cost)}</small></button>`).join('')
    + `<button class="gb" data-a="ult" id="ultBtn" title="${ult.desc}"><b>${ult.icon} ${ult.name}</b><small id="ultTxt"></small><div class="bar" style="width:100%"><i id="ultBar" style="width:0"></i></div></button>`;
}

function canAfford(c) { const p = snap && snap.p[mySide]; return p && p.g >= (c.g || 0) && p.c >= (c.c || 0); }
const myBlds = () => (snap ? snap.b.filter(b => b.o === mySide) : []);

function onSnap() {
  const p = snap.p[mySide];
  $('gold').textContent = p.g;
  $('inc').textContent = `(+${p.inc}/${S.incomeInterval}с)`;
  $('crys').textContent = p.c;
  $('crysT').textContent = p.c < S.maxCrystals ? `(+1 через ${S.crystalRegen - p.ct}с)` : '(макс)';
  $('army').textContent = p.n;
  $('kills').textContent = p.k;
  const left = Math.max(0, S.matchSeconds - snap.tm);
  $('timer').textContent = Math.floor(left / 60) + ':' + String(Math.floor(left % 60)).padStart(2, '0');
  const set = (bar, txt, hp) => { $(bar).style.width = (hp / S.castleHp * 100) + '%'; $(txt).textContent = hp + ' / ' + S.castleHp; };
  set('myHpBar', 'myHpTxt', snap.ch[mySide]); set('foeHpBar', 'foeHpTxt', snap.ch[1 - mySide]);

  const ban = $('banner');
  if (snap.pause) { ban.textContent = `Соперник отключился — ждём ${snap.pause.left} с`; ban.classList.remove('hidden'); }
  else if (mode) { ban.textContent = modeHint(); ban.classList.remove('hidden'); }
  else ban.classList.add('hidden');

  // кнопки: доступность
  const have = new Set(myBlds().map(b => b.ty));
  $('buildPanel').querySelectorAll('button').forEach(btn => {
    const d = DATA.buildings[btn.dataset.k];
    btn.classList.toggle('off', !canAfford(d.cost) || (d.requires && !have.has(d.requires)));
    btn.classList.toggle('act', !!(mode && mode.k === 'place' && mode.type === btn.dataset.k));
  });
  $('shopPanel').querySelectorAll('button[data-a=item]').forEach(btn => {
    btn.classList.toggle('off', !canAfford(DATA.items[btn.dataset.k].cost));
    btn.classList.toggle('act', !!(mode && mode.item === btn.dataset.k));
  });
  const ult = DATA.ults[factions[mySide]];
  const ready = p.u >= S.ultMax && p.uc <= 0;
  $('ultBar').style.width = p.u + '%';
  $('ultTxt').textContent = p.uc > 0 ? `перезарядка ${p.uc}с` : (p.u >= S.ultMax ? 'ГОТОВ · ' : p.u + '% · ') + cost(ult.cost);
  $('ultBtn').classList.toggle('off', !ready || !canAfford(ult.cost));

  for (const e of snap.ev) pushFx(e);
  renderSel();
}

function modeHint() {
  switch (mode.k) {
    case 'place': return 'Кликните клетку на своей базе — строитель подойдёт и построит (Shift — несколько, Esc/ПКМ — отмена)';
    case 'heal': return 'Кликните область на поле для лечения';
    case 'drum': return 'Кликните область на поле для War Drum';
    case 'salve': return 'Кликните своего юнита';
    case 'charge': return 'Кликните вражеское здание';
  }
}

let selSig = '';
function renderSel() {
  const b = snap.b.find(x => x.id === selected && x.o === mySide);
  if (!b) selected = null;
  const d = b && DATA.buildings[b.ty];
  const sig = b ? [b.id, b.ty, b.cd, Math.round(b.hp / 10), Math.round(b.pr * 20), snap.p[mySide].g >> 3, snap.p[mySide].c].join() : 'none';
  if (sig === selSig) return;
  selSig = sig;
  const el = $('selPanel');
  if (!b) { el.innerHTML = '<h3>Выбор</h3><div class="dim"><b>ПКМ</b> — отправить строителя 👷 (по повреждённому зданию — чинить 🔧).<br><b>ЛКМ по зданию</b> — улучшить, продать, способность.<br>Строить: кнопка здания (или 1–5) → клик по клетке базы.<br>Камера: WASD/стрелки, края экрана, миникарта; Пробел — к строителю.</div>'; return; }
  const up = d.upgradeTo && DATA.buildings[d.upgradeTo];
  const ab = d.ability;
  let h = `<h3>${d.icon} ${d.name}</h3><div>HP ${b.hp}/${b.mh}</div>`;
  if (d.unit) h += `<div class="bar"><i style="width:${b.pr * 100}%"></i></div><div class="dim small">${unitInfo(d.unit)}</div>`;
  else h += `<div class="dim small">${d.desc}</div>`;
  if (d.tower) h += '';
  h += '<div class="grid" style="margin-top:6px">';
  if (up) h += `<button class="gb ${canAfford(up.cost) ? '' : 'off'}" data-a="upgrade" title="${up.desc}"><b>⬆️ ${up.name}</b><small>${cost(up.cost)}</small></button>`;
  if (ab) h += `<button class="gb ${b.cd > 0 || !canAfford(ab.cost) ? 'off' : ''}" data-a="ability"><b>✨ ${ab.name}</b><small>${b.cd > 0 ? 'перезарядка ' + b.cd + 'с' : cost(ab.cost)}</small></button>`;
  if (b.hp < b.mh) h += `<button class="gb" data-a="repair" title="Строитель подойдёт и починит. ${S.repairCostPerHp} З за 1 HP"><b>🔧 Чинить</b><small>~${Math.ceil((b.mh - b.hp) * S.repairCostPerHp)}🪙</small></button>`;
  h += `<button class="gb" data-a="sell"><b>💰 Продать</b><small>+${Math.floor(sellValue(b) * S.sellRefund)}🪙</small></button></div>`;
  el.innerHTML = h;
}
function sellValue(b) {
  let v = 0, t = b.ty;
  const chain = { stronghold: 'barracks', ostronghold: 'warhut' };
  v += DATA.buildings[t].cost.g || 0;
  if (chain[t]) v += DATA.buildings[chain[t]].cost.g || 0;
  return v;
}

// ---------- ввод ----------
function setMode(m) { mode = m; selSig = ''; if (snap) onSnap(); }
const keys = new Set();
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'Escape') setMode(null);
  else if (e.code === 'Space') { follow = true; e.preventDefault(); }
  else if (/^[1-9]$/.test(e.key)) { const b = $('buildPanel').querySelectorAll('button')[+e.key - 1]; if (b) b.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true })); }
  else { keys.add(e.key.toLowerCase()); if (e.key.startsWith('Arrow')) e.preventDefault(); }
});
document.addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));

function panelClick(e) {
  const btn = e.target.closest('button[data-a]');
  if (!btn || !snap) return;
  const a = btn.dataset.a, k = btn.dataset.k;
  if (a === 'build') setMode(mode && mode.type === k ? null : { k: 'place', type: k });
  else if (a === 'item') {
    const t = DATA.items[k].target;
    setMode(mode && mode.item === k ? null : { k: { unit: 'salve', area: 'drum', enemyBuilding: 'charge' }[t], item: k });
  }
  else if (a === 'ult') send({ t: 'cmd', c: { c: 'ult' } });
  else if (a === 'upgrade') send({ t: 'cmd', c: { c: 'upgrade', id: selected } });
  else if (a === 'repair') send({ t: 'cmd', c: { c: 'repair', id: selected } });
  else if (a === 'sell') { send({ t: 'cmd', c: { c: 'sell', id: selected } }); selected = null; selSig = ''; }
  else if (a === 'ability') {
    const b = snap.b.find(x => x.id === selected), ab = DATA.buildings[b.ty].ability;
    if (ab.area) setMode({ k: 'heal', id: selected }); else send({ t: 'cmd', c: { c: 'ability', id: selected } });
  }
}
['buildPanel', 'selPanel', 'shopPanel'].forEach(id => $(id).addEventListener('pointerdown', panelClick));

// ---------- изометрическая проекция 2:1 ----------
const VW = 1280, VH = 480, KX = 1.0, KY = 0.62, OFFY = 70;   // вид слева направо, наклон камеры
const cv = $('cv');

const rawP = (m, wy) => ({ x: m * KX, y: wy * KY + OFFY });   // зеркальные мировые -> экран без камеры

function unP(px, py) {                                    // экран -> мировые (x, y) на земле

function slotPos(side, i) {

// ---------- эффекты ----------
function pushFx(e) {

// ---------- отрисовка ----------
const ctx = cv.getContext('2d');
const teamCol = o => (o === mySide ? '#3b82f6' : '#ef4444');
const teamDark = o => (o === mySide ? '#1e40af' : '#991b1b');
const baseEdge = () => L.baseX0 + L.baseCols * L.cell + 10;

function poly(pts, fill, stroke, lw) {
  ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
  ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 1; ctx.stroke(); ctx.lineWidth = 1; }
}
// прямоугольник на земле в обычных мировых координатах
function groundQuad(x0, x1, y0, y1, fill, stroke, lw) {
  const m0 = mirror(x0), m1 = mirror(x1), a = Math.min(m0, m1), b = Math.max(m0, m1);
  poly([Pm(a, y0), Pm(b, y0), Pm(b, y1), Pm(a, y1)], fill, stroke, lw);
}
const lift = (p, h) => ({ x: p.x, y: p.y - h });

function box(mc, wc, dx, dy, h, top, left, right) {

  poly([f0, f1, lift(f1, h), lift(f0, h)], left, 'rgba(0,0,0,.4)');
  poly([lift(b0, h), lift(b1, h), lift(f1, h), lift(f0, h)], top, 'rgba(0,0,0,.45)');

}

function drawBg() {

function updateCamera(dt) {

  if (keys.has('arrowright') || keys.has('d')) px += sp;
  if (keys.has('arrowup') || keys.has('w')) py -= sp;
  if (keys.has('arrowdown') || keys.has('s')) py += sp;

    if (mouse.px < 20) px -= sp * .6; else if (mouse.px > VW - 20) px += sp * .6;
    if (mouse.py < 20) py -= sp * .6; else if (mouse.py > VH - 20) py += sp * .6;
  }

  else if (follow && snap) {
    const b = snap.bl[mySide], r = rawP(mirror(b.x), b.y), k = Math.min(1, dt * 4);

let lastT = performance.now();
function frame(now) {
  const dt = Math.min(0.1, (now - lastT) / 1000); lastT = now;
  if (snap && !$('game').classList.contains('hidden')) {
    updateCamera(dt);
    ctx.clearRect(0, 0, VW, VH);
    drawBg();
    drawSlotsOverlay();
    const items = [];
    for (const s of [0, 1]) items.push({ y: L.laneY + 30, f: () => drawCastle(s) });
    for (const b of snap.b) items.push({ y: slotPos(b.o, b.s).y + 19, f: () => drawBuilding(b) });
    const seen = new Set();
    for (const u of snap.u) { seen.add(u[0]); items.push({ y: u[4], f: () => drawUnit(u, dt) }); }
    for (const id of disp.keys()) if (!seen.has(id)) disp.delete(id);
    for (const s of [0, 1]) items.push({ y: snap.bl[s].y, f: () => drawBuilder(s, dt) });
    items.sort((a, b) => a.y - b.y);
    for (const it of items) it.f();
    drawFx(now);
    drawAimPreview();
    drawMinimap();
  }
  requestAnimationFrame(frame);
}

// ---------- конец матча ----------
function showEnd() {
  const m = ended, box = $('endbox');
  const title = m.winner === -1 ? '🤝 Ничья' : (m.winner === mySide ? '🏆 Победа!' : '💀 Поражение');
  const st = side => m.stats[side];
  const row = (n, f) => `<tr><td>${f(st(mySide))}</td><th>${n}</th><td>${f(st(1 - mySide))}</td></tr>`;
  box.innerHTML = `<div class="card"><h1>${title}</h1><p>${m.reason}</p>
    <table><tr><td><b>Вы</b></td><th></th><td><b>Соперник</b></td></tr>
    <tr><td>${m.castles[mySide]}</td><th>Здоровье замка</th><td>${m.castles[1 - mySide]}</td></tr>
    ${row('Убито юнитов', s => s.kills)}${row('Потеряно юнитов', s => s.lost)}${row('Разрушено зданий', s => s.bKills)}${row('Построено зданий', s => s.built)}${row('Золота заработано', s => s.gold)}</table>
    <div class="dim small">Длительность: ${Math.floor(m.time / 60)}:${String(m.time % 60).padStart(2, '0')}</div>
    <div class="row" style="justify-content:center"><button class="btn primary" id="bRematch">Реванш</button><button class="btn" id="bMenu">В меню</button></div></div>`;
  box.classList.remove('hidden');
  $('bRematch').onclick = () => send({ t: 'rematch' });
  $('bMenu').onclick = leaveRoom;
}

// ---------- старт ----------
(async function init() {
  DATA = await (await fetch('/data.json')).json();
  S = DATA.settings; L = S.layout; W = S.world;
  try { $('name').value = localStorage.getItem('cfName') || ''; } catch {}
  const q = new URLSearchParams(location.search).get('room');
  if (q) $('codeIn').value = q.toUpperCase().slice(0, 4);
  connect();
  requestAnimationFrame(frame);
})();
</script>
</body>
